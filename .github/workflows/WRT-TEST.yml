#CI项目：只出 .config、不编译固件 —— 改完配置先跑这个，几分钟就能看出
#        哪些包被 defconfig 真正选中（默认 TEST=true）
#CI计划：仅手动触发，没有任何自动运行
name: WRT-TEST

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      CONFIG:
        default: 'ZNM2-noWiFi'
        required: true
        type: choice
        options:
          #只留本仓库实际维护的配置
          - JDCloud-noWiFi
          - ZNM2-noWiFi
          - TEST
      SOURCE:
        description: '选择源码线（与两条正式工作流同一套下拉框、同一顺序）'
        default: 'LibWrt'
        required: true
        type: choice
        options:
          #LibWrt   = LiBwrt/LibWrt        @ 25.12-nss  —— 内核 6.12，NSS 加速 + WiFi 卸载
          #OWrt-NSS = VIKINGYFY/immortalwrt @ main      —— 内核 6.18，NSS 加速
          #OWrt-PPE = VIKINGYFY/immortalwrt @ owrt      —— 内核 6.18，PPE 加速（新 edma/ppe 架构）
          #▲分支不单独给输入框的原因见下面那段注释（GitHub 表单不支持联动 + 浏览器 autofill）。
          - LibWrt
          - OWrt-NSS
          - OWrt-PPE
      #★这里不要再加 BRANCH 输入框：
      #GitHub 的 workflow_dispatch 表单不支持联动，选 SOURCE 不会让 BRANCH 自动填值，
      #而浏览器会 autofill 成旧默认值 main。一旦 BRANCH 非空，表达式就会优先用它，
      #结果是「选了 LibWrt 却去拉 main 分支」—— 拉不到，或者拉到非 NSS 的版本。
      #分支与源码线强绑定，交给 SOURCE 带出即可。
      PACKAGE:
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        #必须是布尔字面量：WRT-CORE 的 WRT_TEST 是 boolean
        default: true
        required: true
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{inputs.CONFIG}} · ${{inputs.SOURCE}}
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{inputs.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名：OWrt 两条线都归到 OWrt，LibWrt 归 LibWrt
      WRT_NAME: ${{inputs.SOURCE == 'LibWrt' && 'LibWrt' || 'OWrt'}}
      #默认WIFI名称
      WRT_SSID: ${{inputs.SOURCE == 'LibWrt' && 'LibWrt' || 'OWrt'}}
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址：与两条正式工作流同一套规则 —— OWrt 两条线 10.1、LibWrt 20.1
      WRT_IP: ${{inputs.SOURCE == 'LibWrt' && '192.168.20.1' || '192.168.10.1'}}
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: ${{inputs.SOURCE == 'LibWrt' && 'https://github.com/LiBwrt/LibWrt.git' || 'https://github.com/VIKINGYFY/immortalwrt.git'}}
      #源码分支：LibWrt→25.12-nss；OWrt-PPE→owrt（PPE）；其余→main（NSS）
      WRT_BRANCH: ${{inputs.SOURCE == 'LibWrt' && '25.12-nss' || (inputs.SOURCE == 'OWrt-PPE' && 'owrt' || 'main')}}
      #源码名称
      WRT_SOURCE: ${{inputs.SOURCE == 'LibWrt' && 'LiBwrt/LibWrt' || 'VIKINGYFY/immortalwrt'}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
