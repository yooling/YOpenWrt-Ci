#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            #WRT_WIFI 的初值只是占位，真实取值由 Settings.sh 按机型配置名判定后覆盖
            echo "WRT_WIFI=none"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          # 注入 kenzok8 插件源（small-package 为合并库，每日自动同步，含 openwrt-packages+small 内容）
          # 注意：切勿同时注入 kenzok8/openwrt-packages，两者有51个同名包会冲突
          sed -i '$a src-git smpackage https://github.com/kenzok8/small-package' feeds.conf.default

          ./scripts/feeds update -a

          # 删除 small-package 中覆盖 OpenWrt 核心的基础包（kenzok8 官方 README 建议清理）
          # fullconenat 必须写成 fullconenat*：上游 2026-09-19 用 SONiC 方案替换了 legacy
          # fullcone（核心树里的 fullconenat / fullconenat-nft 均已删除），但 kenzok8 这边
          # 仍留有 fullconenat-nft —— 它内部是 define KernelPackage/nft-fullcone，产出的包名
          # 恰好也是 kmod-nft-fullcone，会顶替被删的核心包。若只写 fullconenat（精确名），
          # 匹配不到 fullconenat-nft，这个同名替代实现就会活下来，一旦配置里还留着
          # CONFIG_PACKAGE_kmod-nft-fullcone=y 就会撞上 fullconenat-sonic 的互斥声明，
          # 在 make world 最后一步 package/install 报 "unable to select packages"。
          rm -rf ./feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat*,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

          # Docker 全家桶保留官方已验证版本(29.6.1)，删除 smpackage 中的同名包避免重复定义
          rm -rf ./feeds/smpackage/docker ./feeds/smpackage/dockerd ./feeds/smpackage/docker-compose
          rm -rf ./feeds/smpackage/containerd ./feeds/smpackage/runc ./feeds/smpackage/tini
          rm -rf ./feeds/smpackage/luci-app-dockerman ./feeds/smpackage/luci-app-docker 2>/dev/null

          # 删除官方 luci/packages feed 中与 kenzok8 重名的插件包，统一保留 kenzok8 版本
          for d in ./feeds/smpackage/*/; do
            [ -d "$d" ] || continue
            N=$(basename "$d")
            rm -rf ./feeds/luci/applications/$N ./feeds/luci/collections/$N ./feeds/luci/themes/$N 2>/dev/null
            rm -rf ./feeds/packages/utils/$N ./feeds/packages/net/$N ./feeds/packages/libs/$N ./feeds/packages/admin/$N ./feeds/packages/lang/$N 2>/dev/null
          done

          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc)

          #依赖预检：几秒钟扫一遍选中包的依赖，把 apk 阶段才会暴露的
          #"unable to select packages ... no such package" 提前列出来。
          #源码已迁移到 apk，缺依赖不再被 defconfig 拦下，而是要等 1.5~3 小时
          #把几百个包全编完之后在 package/install 阶段才炸，代价太大。
          #脚本只告警、永远 exit 0，不会阻断编译。详见 Scripts/DepCheck.sh。
          bash $GITHUB_WORKSPACE/Scripts/DepCheck.sh

          make clean -j$(nproc)

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          #第三方插件源码溯源表（Packages.sh 生成：仓库 / 分支 / commit）
          if [ -f "$GITHUB_WORKSPACE/third-party-sources.txt" ]; then
            cp -f "$GITHUB_WORKSPACE/third-party-sources.txt" ./upload/ThirdParty-"$WRT_CONFIG"-"$WRT_DATE".txt
          fi

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            #---- 可选安装包：只发「编出来了但没装进固件」的，并打成单个压缩包 ----
            #为什么要做差集：=y 的包一样会在 bin/packages/ 下产出 .apk，但它们已经打进
            #固件了，再发一份纯属重复 —— JDCloud-WiFi 那次 Release 81 个文件里 70 个是散
            #装 apk，对着 manifest 一比对，69 个早就内置，真正有用的只有 5 个。
            #判定依据：*.manifest 是固件实际装进去的包清单，拿它和 bin/packages 做差集，
            #剩下的就是 =m（编成包但不进固件）、需要时自己 apk add 装的那些。
            #注意：=m 的包不写进 manifest，所以 Release 正文的插件清单里看不到它们。
            MANIFEST=$(find ./bin/targets/ -type f -name "*.manifest" | head -1)
            if [ -d ./bin/packages ] && [ -n "$MANIFEST" ]; then
              find ./bin/packages -type f \( -name "*.apk" -o -name "*.ipk" \) > /tmp/all-pkgs.txt
              #manifest 每行是「包名 - 版本」，apk 文件名是「包名-版本.apk」，拼起来精确比对。
              #▲不能用前缀匹配：manifest 里有个包就叫 luci，按前缀一对，所有 luci-* 都会被
              #  误判成已内置，=m 的包反而一个都发不出来（实测踩过）。
              awk '
                NR==FNR { if (NF>=3) built[$1 "-" $3]=1; next }
                {
                  f=$0; sub(/^.*\//,"",f); sub(/\.(apk|ipk)$/,"",f)
                  if (!(f in built)) print $0
                }' "$MANIFEST" /tmp/all-pkgs.txt > /tmp/extra-pkgs.txt

              EXTRA=$(wc -l < /tmp/extra-pkgs.txt)
              echo "===== bin/packages 共 $(wc -l < /tmp/all-pkgs.txt) 个包，未打进固件的有 $EXTRA 个 ====="
              if [ "$EXTRA" -gt 0 ]; then
                mkdir -p ./upload/packages/
                while IFS= read -r F; do cp -f "$F" ./upload/packages/; done < /tmp/extra-pkgs.txt
                ls -1 ./upload/packages/
                #打成一个包再发：散着几十上百个 apk 会把 Release 页面撑爆，也没法一眼看出
                #该下哪个。命名跟 Release tag 对齐，解压后直接 apk add *.apk 即可。
                tar -czf ./upload/Packages-extra-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".tar.gz \
                  -C ./upload/packages .
                rm -rf ./upload/packages
              fi
            fi

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          #散装 apk 已经在上一步打成 Packages-extra-*.tar.gz，这里一行就够
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
