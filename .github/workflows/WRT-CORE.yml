#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      #固件名里的无线标识（noWiFi / WiFi）：默认由配置名自动判断，不需要传。
      #只有当配置名里没有 WiFi 字样时才用这个值兜底（例如 TEST）。
      WRT_WIFI:
        required: false
        default: ''
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  #注意不能直接叫 WRT_WIFI：这个名字稍后会被写进 $GITHUB_ENV 覆盖掉，
  #先从输入取到一个独立变量，再决定最终值。
  WRT_WIFI_IN: ${{inputs.WRT_WIFI}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./Config/$WRT_CONFIG.config")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.config")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"

          #Release 排序：tag 必须以日期开头，GitHub 的发行版列表才按时间往下排
          #（机型名开头的 tag 只能靠点开看时间，2026-10-23 就是这么乱的）。
          #文件名里的日期段保留 - 分隔，tag 里用 _ 分隔，避免两者混淆。
          WRT_NOW=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          WRT_DATE=${WRT_NOW/_/-}
          WRT_TAG="${WRT_NOW}_${WRT_CONFIG}_${WRT_SOURCE%%/*}-${WRT_BRANCH//\//-}"

          #固件名里的无线标识由配置名决定（配置名是唯一事实来源）：
          #  含 noWiFi / NO-WIFI / WIFI-NO → noWiFi；含 WiFi / WIFI-YES → WiFi。
          #  配置名里没有 WiFi 字样时才用 WRT_WIFI 输入兜底（例如 TEST）。
          #★不再让调用方硬编码：JDCloud-noWiFi.yml 里写死 noWiFi，万一以后改成带 WiFi 的
          #  配置、忘了同步这一行，固件名就会说谎。
          if printf '%s' "$WRT_CONFIG" | grep -qiE 'no-?wifi|wifi-?no'; then
            WIFI_SEG=noWiFi
          elif printf '%s' "$WRT_CONFIG" | grep -qiE 'wifi'; then
            WIFI_SEG=WiFi
          else
            WIFI_SEG="${WRT_WIFI_IN:-WiFi}"
          fi

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_DATE=$WRT_DATE"
            echo "WRT_TAG=$WRT_TAG"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_WIFI=$WIFI_SEG"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(config\|txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.config >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.config $GITHUB_WORKSPACE/Config/GENERAL.config >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".config

          #TEST 模式下把关键包的选中状态直接打到日志里 —— 第三方包的依赖经常只带出 =m
          #（编成包但不进固件镜像），只看「编译成功」发现不了，这里直接把 y / m / 没选上打出来。
          #★末尾的 uhttpd / nginx* 是期望值校验：uhttpd 应为 y，nginx 那串不该出现。
          if [[ "$WRT_TEST" == 'true' ]]; then
            echo "====================== TEST：关键包选中状态 ======================"
            for PKG in \
              dockerd docker containerd runc docker-compose luci-app-dockerman luci-lib-docker \
              tini nftables-json libseccomp kmod-nf-ipvs kmod-br-netfilter kmod-macvlan iptables-nft \
              ca-certificates fuse-overlayfs kmod-veth kmod-nf-nat \
              luci-app-lucky lucky luci-app-adguardhome adguardhome luci-app-emmc-health \
              luci-app-vlmcsd vlmcsd \
              block-mount e2fsprogs parted kmod-fs-ext4 kmod-fs-vfat kmod-fs-exfat \
              luci-app-upnp miniupnpd \
              ddnsto luci-app-ddnsto \
              luci-app-netwiz luci-app-nikki ca-bundle yq mihomo-meta \
              luci-app-easytier easytier luci-app-wolultra \
              zram-swap kmod-zram kmod-lib-lz4 \
              cpufreq luci-app-cpufreq wpad-openssl hostapd-common automount kmod-usb3 nand-utils \
              uhttpd nginx nginx-util luci-nginx uwsgi ; do
              VAL=$(grep -m 1 "^CONFIG_PACKAGE_${PKG}=" ./.config | cut -d= -f2- || true)
              #★必须区分这两种「没选上」，含义完全不同：
              #  is not set  —— 包在源码树里、kconfig 认得它，只是没被选中（写 =y 就能救）
              #  符号不存在  —— 包压根不在源码树里（源没拉到 / 包名写错 / 依赖条件不满足）
              if [ -z "$VAL" ]; then
                if grep -qm 1 "^# CONFIG_PACKAGE_${PKG} is not set" ./.config; then
                  VAL="n（包在但没选上 —— 显式写 =y 可救）"
                else
                  VAL="符号不存在（源没拉到 / 包名写错）"
                fi
              fi
              printf "%-26s %s\n" "$PKG" "$VAL"
            done
            echo "====================== TEST：内核开关 / 分区大小 ======================"
            for OPT in \
              CONFIG_KERNEL_NAMESPACES CONFIG_KERNEL_CGROUPS CONFIG_KERNEL_MEMCG CONFIG_KERNEL_MEMCG_V1 \
              CONFIG_KERNEL_CPUSETS CONFIG_KERNEL_SECCOMP CONFIG_KERNEL_POSIX_MQUEUE \
              CONFIG_TARGET_ROOTFS_PARTSIZE CONFIG_TARGET_KERNEL_PARTSIZE ; do
              VAL=$(grep -m 1 "^${OPT}=" ./.config | cut -d= -f2- || true)
              if [ -z "$VAL" ]; then
                if grep -qm 1 "^# ${OPT} is not set" ./.config; then
                  VAL="n（写了却没生效 —— 被依赖或默认值压回去了）"
                else
                  VAL="符号不存在（该 target 不适用，写了也白写）"
                fi
              fi
              printf "%-34s %s\n" "$OPT" "$VAL"
            done
            echo "================================================================"
          fi

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV
            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            #★=m 的包（lucky / adguardhome / vlmcsd / easytier）产出在 ./bin/packages，
            #  不进固件镜像；Release 只收 ./wrt/upload，不拷出来就等于白编。
            #  但把一堆 apk 平铺进发行版会把页面搞乱 → 按插件分目录、整体打成一个 tar.gz。
            #  解压后每个插件一个文件夹（主程序 + LuCI 界面 + 中文包），apk add 整目录即可。
            if [ -d ./bin/packages ]; then
              PKG_STAGE=$(mktemp -d)
              for P in lucky adguardhome vlmcsd easytier; do
                mkdir -p "$PKG_STAGE/$P"
                find ./bin/packages -type f \
                  \( -name "${P}*.apk" -o -name "luci-app-${P}*.apk" -o -name "luci-i18n-${P}*.apk" \) \
                  -exec cp -f {} "$PKG_STAGE/$P/" \;
                [ -n "$(ls -A "$PKG_STAGE/$P")" ] || rmdir "$PKG_STAGE/$P"
              done

              if [ -n "$(ls -A "$PKG_STAGE")" ]; then
                printf '%s\n' \
                  "本包是本次编译产出的可选插件（编译时设为 =m，不随固件预装）。" \
                  "每个目录 = 一个插件，内含 主程序 + LuCI 界面 + 中文语言包。" \
                  "" \
                  "安装步骤：" \
                  "  1. 把需要的目录整个传到路由器，例如 /tmp/pkgs/lucky" \
                  "  2. apk add --allow-untrusted /tmp/pkgs/lucky/*.apk" \
                  "  3. rm -f /tmp/luci-indexcache*    # 不删菜单里看不到" \
                  "  4. /etc/init.d/uhttpd restart     # 可选" \
                  "" \
                  "缺依赖时先联网补：apk update && apk add <包名>" \
                  > "$PKG_STAGE/README.txt"

                PKG_TAR="Packages-$WRT_CONFIG-$WRT_INFO-$WRT_BRANCH-$WRT_DATE.tar.gz"
                tar -czf "./upload/$PKG_TAR" -C "$PKG_STAGE" .
                echo "====================== 可选插件包 $PKG_TAR ======================"
                tar -tzf "./upload/$PKG_TAR"
                echo "=============================================================="
              else
                echo "（本次没有产出 =m 的 apk）"
              fi
              rm -rf "$PKG_STAGE"
            fi

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          #tag 以日期开头，发行版列表才按时间从新到旧排（机型名开头只能点开看时间）
          tag_name: ${{env.WRT_TAG}}
          files: ./wrt/upload/*.*
          body: |
            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}/${{env.WRT_SUBTARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI：${{env.WRT_WIFI == 'noWiFi' && '无（本配置不带 WiFi）' || format('名称 {0} / 密码 {1}', env.WRT_SSID, env.WRT_WORD)}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
