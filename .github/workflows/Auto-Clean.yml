name: Auto-Clean

on:
  #自动清理：每天早上5点（UTC 21:00 = 北京时间次日 05:00）
  #⚠ 已用注释停用，不再自动跑，方便以后按需整段恢复。
  #停用原因：本仓库只维护两台机器、全部手动触发编译，不需要每天自动全量重编；
  #  而且下面的清理参数是 keep 0 —— 会连运行记录和 Release 一起删光，
  #  报错日志被清掉就没法回溯了。想清理时手动来跑一次即可
  #  （Actions → Auto-Clean → Run workflow）。
  #需要恢复定时：把下面两行行首的 # 去掉。
  #schedule:
  #  - cron: 0 21 * * *
  #手动清理
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
